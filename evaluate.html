<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Avaliar Livro - BELLA LEITURA💸</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <h2>Avalie: As Sombras de Eldoria</h2>
  <form id="eval-form">
    <label>Nota (1 a 5):</label>
    <input type="number" min="1" max="5" id="nota" required />
    
    <label>Comentário:</label>
    <textarea id="comentario" required></textarea>
    
    <button type="submit" class="btn">Enviar Avaliação</button>
  </form>
  <p id="pontos-msg"></p>

  <script src="script.js"></script>
</body>
</html>
